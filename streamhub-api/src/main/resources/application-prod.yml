spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:streamhub}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Default: validate only — Hibernate never mutates a prod schema. Real operations would
      # manage the schema with Flyway/Liquibase; for the initial bootstrap of this demo you may
      # set JPA_DDL_AUTO=update once, then return to validate.
      ddl-auto: ${JPA_DDL_AUTO:validate}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

# Real AWS S3 — no endpoint override; credentials come from the EC2 IAM instance role.
storage:
  endpoint: ${S3_ENDPOINT:}
  region: ${AWS_REGION:ap-northeast-2}
  bucket: ${S3_BUCKET}

# Real SQS — no endpoint override; credentials from the EC2 IAM instance role.
spring.cloud.aws:
  region.static: ${AWS_REGION:ap-northeast-2}

# 시드 계정: 운영에서는 dev 기본값(admin1234 등)을 상속하지 않는다. 값을 주입하지 않으면 권한 있는
# 두 계정은 생성되지 않고 경고만 남는다(fail-closed). 이미 생성된 계정의 비밀번호는 시더가 건드리지
# 않으므로(existsByLoginId 가드), 회전은 콘솔의 POST /v1/admin/me/password 로 한다.
app:
  seed:
    system-password: ${SEED_ADMIN_PASSWORD:}
    church_manager-password: ${SEED_MANAGER_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
  access-exp-seconds: 3600
  refresh-exp-seconds: 28800

server:
  port: 8080

# Swagger/OpenAPI off in prod: don't expose the full API surface (incl. admin endpoints) or the
# origin host in the generated `servers` url. The Orval client is generated at build time from the
# dev spec, so runtime never needs this. Set SPRINGDOC_ENABLED=true to re-enable temporarily.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
